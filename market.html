<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فیت مارکت | DailyFitBeat</title>
<meta name="description" content="فروشگاه محصولات دیجیتال DailyFitBeat — پک‌های رسپی، برنامه‌های اختصاصی و محصولات سلامتی">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="img/hero-store.jpg" fetchpriority="high">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.mk-hero{min-height:46vh;background:#f6f3ec url('img/hero-store.jpg') center/cover;display:flex;align-items:center;padding:110px 0 50px;position:relative}
.mk-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(to left,rgba(246,243,236,.95),rgba(246,243,236,.4))}
.mk-hero .container{position:relative}
.mk-hero h1{font-size:clamp(28px,4vw,46px);font-weight:900}
.mk-hero p{color:#4d584d;margin-top:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin:26px 0}
.pcard{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 6px 20px rgba(30,43,28,.08);transition:transform .25s, box-shadow .25s}
.pcard:hover{transform:translateY(-5px);box-shadow:0 16px 40px rgba(30,43,28,.15)}
.p-img{position:relative}
.p-img img{width:100%;aspect-ratio:16/10;object-fit:cover}
.p-rate{position:absolute;top:10px;inset-inline-start:10px;background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}
.p-badge{position:absolute;top:10px;inset-inline-end:10px;background:#2d6a35;color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800}
.p-body{padding:16px}
.p-body h4{font-size:15px}
.p-body p{color:#667066;font-size:12px;line-height:1.9;margin:8px 0;min-height:44px}
.p-price{font-weight:900;color:#2d6a35;margin-bottom:12px}
.p-price s{color:#98a298;font-size:12px;font-weight:400;margin-inline-start:8px}
.order-box{background:#fff;border-radius:22px;padding:26px;box-shadow:0 10px 30px rgba(30,43,28,.08);max-width:640px;margin:30px auto}
.order-box label{display:block;font-size:12px;font-weight:700;margin:12px 0 4px}
.order-box input,.order-box select,.order-box textarea{width:100%;padding:11px;border-radius:12px;border:1px solid #ccc;font:inherit;font-size:13px}
#orderOk{display:none;margin-top:16px;background:#e8f4e9;border-radius:14px;padding:16px;font-size:13px;line-height:2}
</style>
</head>
<body data-page="market">
<header id="hdr"></header>

<div class="mk-hero"><div class="container">
  <h1>فیت مارکت 🛍️</h1>
  <p>محصولات دیجیتال سلامتی — یک‌بار خرید، یک عمر استفاده</p>
</div></div>

<section><div class="container">
  <div id="prodGrid" class="pgrid"></div>
</div></section>

<section id="order"><div class="container">
  <div class="order-box">
    <h2 style="font-size:20px">ثبت سفارش / اعلام واریز (پرداخت دستی)</h2>
    <p style="color:#777;font-size:12px;margin-top:6px">اگه بدون ورود خرید کردی، از این فرم استفاده کن؛ ولی پیشنهاد می‌کنیم وارد بشی و آنلاین بخری تا محصولت خودکار در پنل فعال بشه.</p>
    <form id="orderForm">
      <label>نام و نام خانوادگی *</label><input id="oName" required>
      <label>موبایل *</label><input id="oPhone" required dir="ltr">
      <label>ایمیل</label><input id="oEmail" type="email" dir="ltr">
      <label>محصول *</label><select id="oProduct"></select>
      <label>یادداشت</label><textarea id="oNote"></textarea>
      <label>کد پیگیری واریز *</label><input id="oRef" required dir="ltr">
      <button class="btn" style="width:100%;margin-top:16px">ثبت سفارش ✅</button>
    </form>
    <div id="orderOk"></div>
  </div>
</div></section>

<footer id="ftr"></footer>
<script src="site.js"></script>
<script src="app.js"></script>
<script src="shop.js"></script>
</body>
</html>
