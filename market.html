<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فیت مارکت | DailyFitBeat</title>
<meta name="description" content="محصولات دیجیتال دیلی‌بیت: دستور غذایی، برنامه ورزشی و رسپی‌های ویژه">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
html,body{overflow-x:hidden}
.mk-wrap{max-width:1100px;margin:0 auto;padding:20px 16px 46px}
.mk-hero{text-align:center;padding:22px 0 8px}
.mk-hero h1{font-size:26px;font-weight:900;color:#1e2b1c}
.mk-hero p{color:#667066;font-size:13px;margin-top:8px}
#prodGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:16px}
.pcard{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 22px rgba(30,43,28,.08)}
.pcard .p-img{position:relative}
.pcard .p-img img{width:100%;height:150px;object-fit:cover;display:block}
.pcard .p-rate{position:absolute;top:10px;right:10px;background:#2d6a35;color:#fff;border-radius:999px;padding:4px 12px;font-size:11px;font-weight:700}
.pcard .p-badge{position:absolute;top:10px;left:10px;background:#b26a00;color:#fff;border-radius:999px;padding:4px 12px;font-size:11px;font-weight:700}
.pcard .p-body{padding:14px}
.pcard h4{margin:0 0 6px;font-size:14px}
.pcard p{color:#667066;font-size:12px;min-height:36px}
.pcard .p-price{font-weight:900;color:#2d6a35;font-size:14px;margin:8px 0}
.pcard .p-price s{color:#98a298;font-weight:400;font-size:11px;margin-inline-start:6px}
.pcard .p-cart{display:block;width:100%;border:0;background:#2d6a35;color:#fff;border-radius:14px;padding:11px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.order-box{background:#fff;border-radius:22px;padding:20px;margin-top:26px;box-shadow:0 6px 18px rgba(30,43,28,.07)}
.order-box h3{margin:0 0 12px;font-size:15px}
.order-box input,.order-box select,.order-box textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid #d8e2d8;font:inherit;font-size:13px;margin-bottom:10px;background:#fff}
.order-box button{border:0;background:#2d6a35;color:#fff;border-radius:14px;padding:12px 26px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}
#orderOk{display:none;background:#e8f4e9;color:#2d6a35;border-radius:14px;padding:12px;margin-top:12px;font-size:12.5px;line-height:2}
</style>
</head>
<body data-page="market">
<header id="hdr"></header>
<section><div class="container mk-wrap">
  <div class="mk-hero">
    <h1>فیت مارکت</h1>
    <p>محصولات دیجیتال دیلی‌بیت؛ بعد از خرید و تأیید پرداخت، از پنل کاربری قابل دانلود هستند.</p>
  </div>
  <div id="prodGrid"></div>
  <div class="order-box">
    <h3>ثبت سفارش / پرداخت دستی</h3>
    <form id="orderForm">
      <input id="oName" placeholder="نام و نام خانوادگی" required>
      <input id="oPhone" placeholder="شماره موبایل" required>
      <input id="oEmail" placeholder="ایمیل (اختیاری)">
      <select id="oProduct"></select>
      <textarea id="oNote" rows="3" placeholder="یادداشت (اختیاری)"></textarea>
      <input id="oRef" placeholder="کد پیگیری واریز (در صورت پرداخت دستی)">
      <button type="submit">ثبت سفارش</button>
    </form>
    <div id="orderOk"></div>
  </div>
</div></section>
<footer id="ftr"></footer>
<script src="site.js"></script>
<script src="app.js"></script>
<script src="buy.js"></script>
</body>
</html>
