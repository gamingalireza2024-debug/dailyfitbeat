<head>

<link rel="canonical" href="https://dailyfitbeat.ir/market.html">
<meta name="robots" content="index, follow">
<link rel="icon" href="img/favicon.png">
<meta property="og:type" content="website">

<meta property="og:description" content="مکمل‌های اصل و محصولات دیجیتال سالم با پرداخت امن.">
<meta property="og:image" content="https://dailyfitbeat.ir/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="design.css">
<script type="application/ld+json" id="marketLD"></script>
<script>
/* JSON-LD پویا برای محصولات فیت مارکت — بعد از رندر کارت‌ها اجرا می‌شود */
(function () {
  function toNum(s) {
    if (s === '' || s == null) return null;
    var FA = '۰۱۲۳۴۵۶۷۸۹', AR = '٠١٢٣٤٥٦٧٨٩';
    var t = String(s).replace(/[۰-۹]/g, function (x) { return String(FA.indexOf(x)); }).replace(/[٠-٩]/g, function (x) { return String(AR.indexOf(x)); }).replace(/[,،٬\sریال]/g, '');
    if (t === '') return null;
    var n = Number(t);
    return isNaN(n) ? null : n;
  }
  function buildMarketSchema() {
    var cards = document.querySelectorAll('#prodGrid .pcard');
    if (!cards.length) return false;
    var graph = [];
    cards.forEach(function (c, idx) {
      var title = (c.querySelector('.p-body h4') || {}).textContent || '';
      var desc = (c.querySelector('.p-body p') || {}).textContent || '';
      var priceEl = c.querySelector('.p-price');
      if (!priceEl || !title) return;
      var price = toNum(priceEl.textContent);
      if (price == null) return;
      var imgEl = c.querySelector('.p-img img');
      var img = imgEl ? (new URL(imgEl.getAttribute('src') || '', location.origin).href) : '';
      var ratingEl = c.querySelector('.p-rate');
      var rating = null;
      if (ratingEl) {
        var rt = toNum(ratingEl.textContent.replace(/[^\d\.۰-۹٠-٩]/g, ''));
        if (rt != null && rt > 0 && rt <= 5) rating = rt;
      }
      var product = {
        "@type": "Product",
        "name": title,
        "description": desc.slice(0, 300),
        "image": img || "https://dailyfitbeat.ir/img/og.jpg",
        "category": "محصولات دیجیتال تغذیه و تناسب اندام",
        "brand": { "@type": "Brand", "name": "DailyFitBeat" },
        "offers": {
          "@type": "Offer",
          "price": price,
          "priceCurrency": "IRR",
          "availability": "https://schema.org/InStock",
          "url": "https://dailyfitbeat.ir/market.html",
          "seller": { "@type": "Organization", "name": "DailyFitBeat" }
        }
      };
      if (rating != null) {
        product.aggregateRating = {
          "@type": "AggregateRating",
          "ratingValue": rating,
          "bestRating": 5,
          "worstRating": 1,
          "ratingCount": 1
        };
      }
      graph.push(product);
    });
    if (!graph.length) return false;
    var schema = { "@context": "https://schema.org", "@graph": graph };
    var ld = document.getElementById('marketLD');
    if (ld) ld.textContent = JSON.stringify(schema);
    return true;
  }
  var tries = 0;
  var t = setInterval(function () {
    if (buildMarketSchema() || tries++ > 80) clearInterval(t);
  }, 250);
})();
</script>
</head>
<body data-page="market">
<header id="hdr"></header>
<section><div class="container mk-wrap">
  <div class="mk-hero">
    <h1>فیت مارکت</h1>
    <p>محصولات دیجیتال دیلی‌بیت؛ بعد از خرید و تأیید پرداخت، از پنل کاربری قابل دانلود هستند.</p>
  </div>
  <div id="prodGrid"></div>
  <div class="order-box">
    <h3>ثبت سفارش / پرداخت دستی</h3>
    <form id="orderForm">
      <input id="oName" placeholder="نام و نام خانوادگی" required>
      <input id="oPhone" placeholder="شماره موبایل" required>
      <input id="oEmail" placeholder="ایمیل (اختیاری)">
      <select id="oProduct"></select>
      <textarea id="oNote" rows="3" placeholder="یادداشت (اختیاری)"></textarea>
      <input id="oRef" placeholder="کد پیگیری واریز (در صورت پرداخت دستی)">
      <button type="submit">ثبت سفارش</button>
    </form>
    <div id="orderOk"></div>
  </div>
</div></section>
<footer id="ftr"></footer>
<script src="site.js"></script>
<script src="app.js"></script>
<script src="buy.js"></script>
</body>
</html>
