<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRO | DailyFitBeat</title>
<meta name="description" content="اشتراک PRO دیلی‌بیت: برنامه اختصاصی، ذخیره نامحدود و لیست خرید هوشمند">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
html,body{overflow-x:hidden}
.pr-wrap{max-width:1000px;margin:0 auto;padding:20px 16px 46px}
.pr-hero{text-align:center;padding:22px 0 8px}
.pr-hero h1{font-size:26px;font-weight:900;color:#1e2b1c}
.pr-hero p{color:#667066;font-size:13px;margin-top:8px}
.plan-tog{display:flex;gap:8px;justify-content:center;margin:18px 0}
.plan-tog button{border:0;background:#fff;border-radius:999px;padding:10px 22px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.07);color:#3c4a3c}
.plan-tog button.on{background:#2d6a35;color:#fff}
#planCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:10px}
.price-card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 22px rgba(30,43,28,.08);position:relative}
.price-card.hot{border:2px solid #2d6a35}
.price-card h3{margin:0 0 10px;font-size:15px}
.price-card .p{font-size:20px;font-weight:900;color:#2d6a35}
.price-card .oldp{color:#98a298;font-size:12px}
.price-card ul{list-style:none;margin:12px 0;padding:0;font-size:12.5px;line-height:2.2}
.price-card .ribbon{position:absolute;top:-12px;left:16px;background:#2d6a35;color:#fff;border-radius:999px;padding:5px 14px;font-size:11px;font-weight:700}
.price-card a.btn{display:inline-block;background:#2d6a35;color:#fff;border:0;border-radius:14px;padding:11px 22px;font:inherit;font-size:13px;font-weight:800;text-decoration:none;cursor:pointer}
.pr-steps{background:#fff;border-radius:22px;padding:20px;margin-top:22px;box-shadow:0 6px 18px rgba(30,43,28,.07);font-size:12.5px;line-height:2.4}
.pr-steps h3{margin:0 0 8px;font-size:14px}
</style>
</head>
<body data-page="pro">
<header id="hdr"></header>
<section><div class="container pr-wrap">
  <div class="pr-hero">
    <h1>اشتراک PRO دیلی‌بیت</h1>
    <p>برنامه اختصاصی، ذخیره نامحدود، لیست خرید هوشمند و سهمیه بیشتر دستیار AI.</p>
  </div>
  <div class="plan-tog">
    <button class="on" data-key="monthly">ماهانه</button>
    <button data-key="yearly">سالانه</button>
  </div>
  <div id="planCards"></div>
  <div class="pr-steps">
    <h3>روش خرید و فعال‌سازی</h3>
    <p>۱. پلن موردنظر را انتخاب کن.<br>۲. کارت بانکی نمایش‌داده‌شده را واریض کن.<br>۳. کد پیگیری را ثبت کن.<br>۴. پس از تأیید ادمین، PRO به‌صورت خودکار در پنل تو فعال می‌شود.</p>
  </div>
</div></section>
<footer id="ftr"></footer>
<script src="site.js"></script>
<script src="app.js"></script>
<script src="buy.js"></script>
</body>
</html>
