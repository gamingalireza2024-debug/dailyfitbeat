<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل ادمین | DailyFitBeat</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.atabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.atab{border:0;background:#fff;border-radius:14px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.atab.on{background:#2d6a35;color:#fff}
.apane{display:none}
.admin-tbl input,.admin-tbl textarea{width:120px;padding:8px;border-radius:10px;border:1px solid #ccc;font:inherit;font-size:12px}
.admin-tbl textarea{width:220px;height:60px}
.admin-tbl .imgin{width:180px;direction:ltr}
.del-btn{background:#d33;color:#fff;border:0;border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit}
.add-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.add-form input{padding:10px;border-radius:10px;border:1px solid #ccc;font:inherit;font-size:13px}
.rec-form{background:#fff;border-radius:18px;padding:20px;margin:16px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.rec-form input,.rec-form select,.rec-form textarea{padding:10px;border-radius:10px;border:1px solid #ccc;font:inherit;font-size:13px}
.rec-form textarea{grid-column:1/-1;height:80px}
.rec-form .full{grid-column:1/-1}
</style>
</head>
<body data-page="admin">
<header id="hdr"></header>

<div class="page-head"><div class="container"><h1>👑 پنل مدیریت</h1><p id="adminStat">در حال بررسی دسترسی...</p></div></div>

<section id="adminBody" style="display:none">
  <div class="container">
    <div class="atabs">
      <button class="atab on" data-t="orders">📦 سفارش‌ها</button>
      <button class="atab" data-t="recipes">🍳 رسپی‌ها</button>
      <button class="atab" data-t="prods">🛍️ محصولات</button>
      <button class="atab" data-t="plans">💎 پلان‌های PRO</button>
    </div>

    <div class="apane" id="pane-orders" style="display:block">
      <div class="admin-stats" id="statsBox"></div>
      <div class="admin-bar">
        <button class="btn" id="csvBtn">📥 خروجی اکسل (همه شماره‌ها)</button>
        <select id="filterSt" class="chip">
          <option value="all">همه سفارش‌ها</option>
          <option value="new">جدید</option>
          <option value="paid">پرداخت شده</option>
          <option value="sent">ارسال شده</option>
        </select>
      </div>
      <table class="admin-tbl">
        <thead><tr><th>کد</th><th>تاریخ</th><th>نام</th><th>موبایل</th><th>ایمیل</th><th>محصول</th><th>کد واریز</th><th>وضعیت</th><th></th></tr></thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>

    <div class="apane" id="pane-recipes">
      <button class="btn" id="rNew">➕ رسپی جدید</button>
      <div id="recForm" class="rec-form" style="display:none">
        <input id="rSlug" placeholder="slug انگلیسی (مثل kuku-sabzi)">
        <input id="rNameFa" placeholder="نام فارسی">
        <input id="rNameEn" placeholder="نام انگلیسی">
        <select id="rCat"><option value="iranian">iranian</option><option value="main">main</option><option value="salad">salad</option><option value="sandwich">sandwich</option><option value="breakfast">breakfast</option><option value="soup">soup</option></select>
        <input id="rRegion" placeholder="کشور (ایران/ژاپن/...)">
        <input id="rTime" type="number" placeholder="زمان پخت">
        <input id="rKcal" type="number" placeholder="کالری">
        <input id="rProtein" type="number" placeholder="پروتئین">
        <input id="rCarbs" type="number" placeholder="کربوهیدرات">
        <input id="rFat" type="number" placeholder="چربی">
        <input id="rFiber" type="number" placeholder="فیبر">
        <input id="rSugar" type="number" placeholder="قند">
        <input id="rImage" class="imgin" placeholder="تصویر (img/...)">
        <input id="rVideo" class="imgin" placeholder="لینک ویدیو (اختیاری)">
        <input id="rTags" placeholder="تگ‌ها: high-protein,quick">
        <input id="rKeys" placeholder="کلیدها: chicken,egg">
        <textarea id="rDesc" class="full" placeholder="توضیح فارسی"></textarea>
        <textarea id="rIngs" placeholder="مواد (هر خط: نام:مقدار)&#10;مرغ:۴۰۰گ&#10;قارچ:۲۰۰گ"></textarea>
        <textarea id="rSteps" placeholder="مراحل پخت (هر خط یک مرحله)"></textarea>
        <textarea id="rTips" placeholder="نکات پخت (هر خط یک نکته)"></textarea>
        <button class="btn full" id="rSave">💾 ذخیره رسپی</button>
      </div>
      <table class="admin-tbl">
        <thead><tr><th>رسپی</th><th>دسته</th><th>کشور</th><th>کالری</th><th>تصویر</th><th></th><th></th></tr></thead>
        <tbody id="recBody"></tbody>
      </table>
    </div>

    <div class="apane" id="pane-prods">
      <table class="admin-tbl">
        <thead><tr><th>محصول</th><th>قیمت (ریال)</th><th>قیمت قدیم</th><th>تخفیف ٪</th><th>امتیاز</th><th>تصویر</th><th>فعال</th><th></th><th></th></tr></thead>
        <tbody id="prodBody2"></tbody>
      </table>
      <h4 style="margin:16px 0 8px">➕ محصول جدید</h4>
      <div class="add-form">
        <input id="aTitle" placeholder="نام محصول">
        <input id="aDesc" placeholder="توضیح">
        <input id="aPrice" type="number" placeholder="قیمت (ریال)">
        <input id="aOld" type="number" placeholder="قیمت قدیم (اختیاری)">
        <input id="aOff" type="number" placeholder="تخفیف ٪">
        <input id="aRate" type="number" step="0.1" value="4.8" placeholder="امتیاز">
        <input id="aImg" class="imgin" placeholder="آدرس تصویر">
        <button class="btn" id="aAdd">افزودن</button>
      </div>
    </div>

    <div class="apane" id="pane-plans">
      <table class="admin-tbl">
        <thead><tr><th>پلان</th><th>دوره</th><th>قیمت (ریال)</th><th>قیمت قدیم</th><th>امکانات (هر خط یکی)</th><th></th><th></th></tr></thead>
        <tbody id="plansBody2"></tbody>
      </table>
      <h4 style="margin:16px 0 8px">➕ پلان جدید</h4>
      <div class="add-form">
        <input id="pTitle" placeholder="نام پلان">
        <input id="pPeriod" placeholder="دوره (مثلاً ماهانه)">
        <input id="pPrice" type="number" placeholder="قیمت (ریال)">
        <input id="pOld" type="number" placeholder="قیمت قدیم">
        <button class="btn" id="pAdd">افزودن</button>
      </div>
    </div>

    <div id="prodBody" hidden></div>
    <div id="plansBody" hidden></div>
  </div>
</section>

<footer id="ftr"></footer>
<script src="site.js"></script>
<script src="app.js"></script>
<script src="admin.js"></script>
</body>
</html>
