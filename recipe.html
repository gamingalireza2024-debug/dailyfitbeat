<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رسپی | DailyFitBeat</title>
<meta name="description" content="رسپی سالم با ارزش غذایی دقیق">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.crumbs{padding:14px 0 0;font-size:13px;color:#77807a}
.crumbs a{color:#2d6a35;text-decoration:none}
.crumbs span{color:#555}
.rd-wrap{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start;padding:24px 0 40px}
.rd-img img{width:100%;border-radius:26px;box-shadow:0 16px 50px rgba(30,43,28,.15)}
.rd-en{color:#8a938a;margin:4px 0 10px}
.rd-desc{color:#4d584d;line-height:2;margin:10px 0 16px}
.ing-list{list-style:none;margin:16px 0;background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.ing-list li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #e3e3e3;font-size:14px}
.ing-list li span{color:#2d6a35;font-weight:700}
.f-cta{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.rel-sec{padding:10px 0 50px}
.rel-head{display:flex;justify-content:flex-start;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:16px}
.rel-head h2{font-size:22px}
.rel-more{margin-top:16px;color:#667066;font-size:14px}
.rel-more a{color:#2d6a35;font-weight:700}
@media(max-width:900px){.rd-wrap{grid-template-columns:1fr}}
  .nutrition-grid{display:grid;gap:12px;margin:20px 0}
.nut-bar{background:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.nut-bar b{font-size:20px;color:#2d6a35;display:block}
.nut-bar span{font-size:12px;color:#777}
.nut-bar .bar{height:6px;background:#e8f4e9;border-radius:99px;margin-top:8px;overflow:hidden}
.nut-bar .bar div{height:100%;background:linear-gradient(90deg,#2d6a35,#4a9d5f);border-radius:99px}
.steps-section,.tips-section,.subs-section,.video-section{margin:26px 0}
.steps-section h3,.tips-section h3,.subs-section h3,.video-section h3{font-size:18px;margin-bottom:14px}
.steps-list{list-style:none;counter-reset:step}
.steps-list li{display:flex;gap:14px;margin-bottom:18px;align-items:flex-start}
.step-num{background:#2d6a35;color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.steps-list li p{color:#4d584d;line-height:1.8;margin:0;flex:1}
.tips-list{list-style:none}
.tips-list li{background:#fff;border-radius:12px;padding:12px 16px;margin-bottom:8px;color:#4d584d;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.tips-list li:before{content:"✓";color:#2d6a35;font-weight:900;margin-inline-end:10px}
.subs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.sub-card{background:#fff;border-radius:12px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.sub-card b{color:#2d6a35;display:block;font-size:14px}
.sub-card span{color:#888;font-size:18px;margin:6px 0;display:block}
.video-card{display:block;text-decoration:none;color:inherit}
.video-thumb{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:16/9}
.video-thumb img{width:100%;height:100%;object-fit:cover}
.play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;background:rgba(255,255,255,.92);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:#dc2743}
.video-card p{margin-top:10px;color:#2d6a35;font-weight:700;text-align:center}
</style>
</head>
<body data-page="recipe">
<header id="hdr"></header>
<div id="rd"></div>
<footer id="ftr"></footer>
<script src="site.js"></script>
<script src="app.js"></script>
<script src="recipe-seo.js"></script>
</body>
</html>
