<head>

<meta name="description" content="رسپی واقعی با کالری، ماکروها، مواد لازم و مراحل پخت گام‌به‌گام از دیلی‌بیت.">
<link rel="canonical" href="https://dailyfitbeat.ir/recipe.html">
<meta name="robots" content="index, follow">
<link rel="icon" href="img/favicon.png">
<meta property="og:type" content="article">
<meta property="og:url" content="https://dailyfitbeat.ir/recipe.html">
<meta property="og:title" content="رسپی | DailyFitBeat">
<meta property="og:description" content="رسپی واقعی با کالری، ماکروها و مراحل پخت گام‌به‌گام.">
<meta property="og:image" content="https://dailyfitbeat.ir/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="design.css">
<script type="application/ld+json" id="recipeLD"></script>
</head>
<body data-page="recipe">
<header id="hdr"></header>
<div id="rd"></div>
<footer id="ftr"></footer>
<script src="site.js"></script>
<script src="app.js"></script>
<script src="recipe-seo.js"></script>
  <script>
window.DFB_setRecipeMeta = function (r) {
  try {
    document.title = r.name_fa + ' | DailyFitBeat';
    var canon = document.querySelector('link[rel="canonical"]');
    if (canon) canon.href = 'https://dailyfitbeat.ir/recipe.html?slug=' + encodeURIComponent(r.slug);
    var ogT = document.querySelector('meta[property="og:title"]'); if (ogT) ogT.content = r.name_fa + ' | DailyFitBeat';
    var ogD = document.querySelector('meta[property="og:description"]'); if (ogD) ogD.content = (r.desc_fa || '').slice(0, 160);
    var ogI = document.querySelector('meta[property="og:image"]'); if (ogI && r.image) ogI.content = new URL(r.image, location.origin).href;
    var ld = document.getElementById('recipeLD');
    if (ld) ld.textContent = JSON.stringify({
      "@context": "https://schema.org", "@type": "Recipe",
      name: r.name_fa, description: r.desc_fa || '', image: r.image || '',
      totalTime: 'PT' + (r.time_min || 30) + 'M', recipeYield: '1 سرو',
      recipeCategory: r.category || '', recipeCuisine: r.region || 'ایران',
      nutrition: { "@type": "NutritionInformation", calories: (r.kcal || 0) + ' kcal', proteinContent: (r.protein || 0) + ' g' },
      recipeIngredient: (r.ingredients || []).map(function (i) { return i.fa + ' ' + i.q; }),
      recipeInstruction: (r.steps || []).map(function (s) { return { "@type": "HowToStep", text: s }; })
    });
  } catch (e) {}
};
</script>
</body>
</html>
