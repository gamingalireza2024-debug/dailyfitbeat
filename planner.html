<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>برنامه غذایی | DailyFitBeat</title>
<meta name="description" content="برنامه غذایی هفتگی با ۵ وعده در روز + لیست خرید هفتگی + PDF">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
html,body{overflow-x:hidden}
.pl-wrap{max-width:860px;margin:0 auto;padding:16px}
.pl-hero{text-align:center;padding:16px 0 6px}
.pl-hero h1{font-size:22px;font-weight:900}
.pl-hero p{color:#667066;font-size:13px;margin-top:6px}
.pl-box{background:rgba(255,255,255,.7);backdrop-filter:blur(8px);border-radius:22px;padding:18px;box-shadow:0 8px 26px rgba(30,43,28,.08);margin:14px 0}
.pl-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.pl-row input{padding:9px 12px;border-radius:12px;border:1px solid #ccc;font:inherit;font-size:13px;background:#fff;width:140px}
.pl-row label{font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center;background:#fff;border-radius:999px;padding:8px 14px;box-shadow:0 3px 10px rgba(0,0,0,.06);cursor:pointer}
#plGo{margin-top:14px;width:100%}
.day-card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.day-card h4{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.meal-line{display:flex;gap:8px;align-items:baseline;padding:7px 0;border-top:1px dashed #e5efe5;font-size:13px;flex-wrap:wrap}
.meal-line b{color:#2d6a35;min-width:88px}
.meal-line small{color:#77807a}
.shop-card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.shop-card ul{columns:2;font-size:12.5px;line-height:2.1}
.shop-card li{list-style:none}
@media(max-width:600px){.shop-card ul{columns:1}.pl-row{flex-direction:column}.pl-row input{width:100%}}
</style>
</head>
<body data-page="planner">
<header id="hdr"></header>
<section><div class="container pl-wrap">
  <div class="pl-hero"><h1>برنامه غذایی هفتگی</h1><p>۵ وعده در روز، متناسب با کالری هدف تو + لیست خرید هفتگی.</p></div>
  <div class="pl-box">
    <div class="pl-row">
      <input id="plKcal" type="number" placeholder="کالری هدف روزانه" value="2000">
      <label><input type="checkbox" id="plProf" checked> استفاده از پروفایل تغذیه من</label>
    </div>
    <button class="btn" id="plGo">✨ ساخت برنامه ۷ روزه</button>
    <div style="text-align:center;margin-top:10px"><button class="btn" id="plPdf" disabled>📥 دانلود PDF برنامه</button></div>
  </div>
  <div id="plOut"></div>
  <div id="plShopWrap"></div>
</div></section>
<div id="pdfDoc" style="position:fixed;inset-inline-start:-2000px;top:0;width:794px;background:#fff"></div>
<footer id="ftr"></footer>
<script src="site.js"></script>
<script src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="planner.js"></script>
</body>
</html>
