<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دیلی بیت | DailyFitBeat — خوب بخور، بهتر زندگی کن</title>
<meta name="description" content="رسپی‌های سالم ایرانی و جهانی، برنامه غذایی هوشمند و فیت مارکت">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.hero{background:linear-gradient(rgba(10,15,10,.45),rgba(10,15,10,.55)),url('img/hero.jpg') center/cover;min-height:76vh;display:flex;align-items:center}
.hero h1{color:#fff;font-size:clamp(30px,5vw,56px);font-weight:900}
.hero h1 span{color:#8fd18f}
.hero p{color:#eee;max-width:600px;line-height:2;margin:14px 0 24px}
.search-sec{margin-top:-34px;position:relative;z-index:5}
.search-box{background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.10);padding:14px 18px;display:flex;gap:10px;align-items:center}
.search-box input{border:0;outline:0;flex:1;font:inherit;font-size:14px;background:transparent}
.search-res{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:14px}
.finder-row{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.finder-row input{flex:1;min-width:200px;padding:12px;border-radius:12px;border:1px solid #ccc;font:inherit}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.no-res{color:#777}
</style>
</head>
<body data-page="home">
<header id="hdr"></header>

<section class="hero"><div class="container">
  <h1>خوب بخور، <span>بهتر زندگی کن</span></h1>
  <p>رسپی‌های سالم و اشتهابرانگیز، برنامه غذایی هوشمند و دستیاری که می‌دونه توی یخچالت چی داری</p>
  <div class="hero-btns">
    <a class="btn big" href="#finder">غذای بعدی من رو پیدا کن</a>
    <a class="btn ghost" href="recipes.html">دیدن رسپی‌ها</a>
  </div>
</div></section>

<section class="search-sec"><div class="container">
  <div class="search-box"><span>🔍</span><input id="searchInput" placeholder="جستجو: اسم غذا، ماده اولیه، شهر، دسته... مثلاً: بادمجان، گیلان، پروتئین"></div>
  <div id="searchRes" class="search-res"></div>
</div></section>

<section id="finder"><div class="container">
  <div class="sec-head"><h2>توی یخچالت چی داری؟</h2><p>موادت رو انتخاب کن؛ DailyFitBeat می‌گه با اینا چی میشه پخت</p></div>
  <div id="chips"></div>
  <div class="finder-row">
    <input id="ingInput" placeholder="ماده دیگه بنویس (مثلاً بادمجان)">
    <button id="ingAdd" class="btn ghost">افزودن</button>
    <button id="goBtn" class="btn">چی بپزم؟ 🍳</button>
  </div>
  <div id="results" class="cards"></div>
</div></section>

<section><div class="container">
  <div class="sec-head"><h2>محبوب‌های این هفته</h2></div>
  <div id="popularCards" class="cards"></div>
</div></section>

<footer id="ftr"></footer>
<script src="app.js"></script>
</body>
</html>
