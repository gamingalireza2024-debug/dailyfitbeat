name: recipe-import

on:
  push:
    paths:
      - "import/dishes.txt"
  workflow_dispatch:
    inputs:
      limit:
        description: "حداکثر تعداد رسپی در این اجرا (خالی = همه)"
        default: ""

permissions:
  contents: write

concurrency:
  group: recipe-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sharp
        run: npm i sharp@0.33.5 --no-fund --no-audit

      - name: Run AI importer
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: node scripts/import-recipes.mjs

      - name: Commit results + images
        if: always()
        run: |
          git config user.name "dfb-bot"
          git config user.email "bot@dailyfitbeat.ir"
          git add img/recipes import/done.txt import/dishes.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "چیزی برای کامیت نبود"
            exit 0
          fi
          git commit -m "chore: recipe import [skip ci]"
          git pull --rebase origin main
          git push
