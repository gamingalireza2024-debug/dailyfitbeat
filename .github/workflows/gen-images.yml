name: gen-food-images

on:
  workflow_dispatch:
    inputs:
      force:
        description: "1 = بازسازی عکس‌های موجود"
        default: "0"
      limit:
        description: "حداکثر تعداد عکس در این اجرا (۵ تا ۱۰۰)"
        default: "40"

permissions:
  contents: write

concurrency:
  group: gen-food-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i sharp@0.33.5 --no-fund --no-audit

      - name: Generate (AI-directed + vision QC)
        env:
          FORCE: ${{ github.event.inputs.force }}
          LIMIT: ${{ github.event.inputs.limit }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/gen-images.mjs

      - name: Commit
        if: always()
        run: |
          git config user.name "dfb-bot"
          git config user.email "bot@dailyfitbeat.ir"
          git add img
          if git diff --staged --quiet; then
            echo "چیزی برای کامیت نبود"
            exit 0
          fi
          git commit -m 'food images pro [skip ci]'
          git pull --rebase origin main
          git push
