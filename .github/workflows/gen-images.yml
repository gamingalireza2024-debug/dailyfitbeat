name: gen-food-images

on:
  workflow_dispatch:
    inputs:
      force:
        description: "1 = بازسازی عکس‌های موجود"
        default: "0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i sharp

      - name: Generate (AI-directed + vision QC)
        env:
          FORCE: ${{ github.event.inputs.force }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/gen-images.mjs

      - name: Commit
        run: |
          git config user.name "dfb-bot"
          git config user.email "bot@dailyfitbeat.ir"
          git add img
          (git diff --staged --quiet || git commit -m 'food images pro [skip ci]') && (git pull --rebase origin main || true) && git push
