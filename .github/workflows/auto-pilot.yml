name: auto-pilot

on:
  schedule:
    # هفته‌ای فقط ۲ روز — شنبه و سه‌شنبه ساعت ۰۵:۰۰ UTC (۰۸:۳۰ صبح ایران)
    - cron: "0 5 * * 6,3"
  workflow_dispatch:
    inputs:
      enrich_limit:
        description: "تکمیل اطلاعات چند رسپی قدیمی (۵ تا ۱۰۰)"
        default: "30"
      images_limit:
        description: "ساخت عکس چند رسپی بدون عکس (۵ تا ۱۰۰)"
        default: "15"
      import_limit:
        description: "چند غذای جدید اضافه شود"
        default: "3"

permissions:
  contents: write

concurrency:
  group: auto-pilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sharp
        run: npm i sharp@0.33.5 --no-fund --no-audit

      - id: s0
        name: "۰) بررسی سلامت کلیدها (گزارش)"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/check-keys.mjs

      - id: s1
        name: "۱) پر کردن صف غذای جدید (کشف خودکار)"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/discover-dishes.mjs

      - id: s2
        name: "۲) تکمیل فیلدهای خالی رسپی‌های قدیمی"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          LIMIT: ${{ github.event.inputs.enrich_limit || '30' }}
        run: node scripts/enrich-recipes.mjs

      - id: s3
        name: "۳) ساخت عکس رسپی‌های بدون عکس"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIMIT: ${{ github.event.inputs.images_limit || '15' }}
        run: node scripts/gen-images.mjs

      - id: s4
        name: "۴) افزودن غذاهای جدید"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIMIT: ${{ github.event.inputs.import_limit || '3' }}
        run: node scripts/import-recipes.mjs

      - id: s5
        name: "۵) فشرده‌سازی عکس‌های سنگین"
        run: node scripts/optimize-images.mjs

      - name: Commit results
        if: always()
        run: |
          git config user.name "dfb-bot"
          git config user.email "bot@dailyfitbeat.ir"
          git add img import 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "چیزی برای کامیت نبود"
            exit 0
          fi
          git commit -m "auto-pilot: enrich + images + new recipes [skip ci]"
          git pull --rebase origin main
          git push

      - name: "۶) گزارش به ربات تلگرام ادمین"
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Secrets تلگرام (TG_TOKEN / TG_CHAT) تنظیم نشده — گزارش ارسال نشد"
            exit 0
          fi
          mark() { if [ "$2" = "success" ]; then echo "1"; else echo "0"; fi; }
          T0=$(mark s0 "${{ steps.s0.outcome }}"); T1=$(mark s1 "${{ steps.s1.outcome }}")
          T2=$(mark s2 "${{ steps.s2.outcome }}"); T3=$(mark s3 "${{ steps.s3.outcome }}")
          T4=$(mark s4 "${{ steps.s4.outcome }}"); T5=$(mark s5 "${{ steps.s5.outcome }}")
          TEXT="🤖 گزارش auto-pilot دیلی‌بیت
          وضعیت کل ران: ${{ job.status }}
          ۰) سلامت کلیدها: ${{ steps.s0.outcome }}
          ۱) کشف غذا: ${{ steps.s1.outcome }}
          ۲) غنی‌سازی: ${{ steps.s2.outcome }}
          ۳) ساخت عکس: ${{ steps.s3.outcome }}
          ۴) ایمپورت: ${{ steps.s4.outcome }}
          ۵) بهینه‌سازی عکس: ${{ steps.s5.outcome }}
          🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s --max-time 20 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" --data-urlencode text="$TEXT" > /dev/null || true
