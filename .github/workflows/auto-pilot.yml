name: auto-pilot

on:
  schedule:
    # هفته‌ای ۳ بار — شنبه، دوشنبه، چهارشنبه ساعت ۰۵:۰۰ UTC (۰۸:۳۰ صبح ایران)
    # قبل‌تر ۲ بار بود (شنبه/سه‌شنبه)؛ حالا با ۳ بار، رسپی‌های ناقص سریع‌تر تمیز می‌شوند
    # اما سقف هر اجرا کمتر شده تا به لیمیت روزانه Gemini (۱۵۰۰ req/day رایگان) نخوریم
    - cron: "0 5 * * 6,1,3"
  workflow_dispatch:
    inputs:
      enrich_limit:
        description: "تکمیل اطلاعات چند رسپی قدیمی (۵ تا ۱۰۰) — پیشنهاد: ۲۰"
        default: "20"
      images_limit:
        description: "ساخت عکس چند رسپی بدون عکس (۱ تا ۱۰۰) — پیشنهاد: ۱۰"
        default: "10"
      import_limit:
        description: "چند غذای جدید اضافه شود (۱ تا ۱۰) — پیشنهاد: ۲"
        default: "2"
      focus:
        description: "تمرکز این اجرا: enrich (تمیزسازی رسپی قدیمی) | images (عکس) | all (همه)"
        type: choice
        default: all
        options:
          - all
          - enrich
          - images

permissions:
  contents: write

concurrency:
  group: auto-pilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sharp
        run: npm i sharp@0.33.5 --no-fund --no-audit

      # ───────── مرحله ۰: بررسی سلامت کلیدها (گزارش، بدون توقف) ─────────
      - id: s0
        name: "۰) بررسی سلامت کلیدها (گزارش)"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/check-keys.mjs

      # ───────── مرحله ۱: پر کردن صف غذای جدید (خفیف، ۸ درخواست AI) ─────────
      - id: s1
        name: "۱) پر کردن صف غذای جدید (کشف خودکار)"
        if: ${{ github.event.inputs.focus != 'images' }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/discover-dishes.mjs

      # ───────── مرحله ۲: تمیز کردن رسپی‌های قدیمی ناقص ─────────
      # این قلب کار است: فیلدهای خالی steps/tips/desc/region/macros/substitutions را پر می‌کند.
      # سقف پیشنهادی ۲۰ به‌جای ۳۰، تا ۳ بار در هفته بدون خوردن به لیمیت روزانه Gemini اجرا شود.
      # اگر در یک روز همه‌اش ۴۲۹ (Rate Limit) بگیریم، در اجرای بعدی همان رسپی‌ها را ادامه می‌دهد.
      - id: s2
        name: "۲) تکمیل فیلدهای خالی رسپی‌های قدیمی"
        if: ${{ github.event.inputs.focus != 'images' }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          LIMIT: ${{ github.event.inputs.enrich_limit || '20' }}
        run: node scripts/enrich-recipes.mjs

      # ───────── مرحله ۳: ساخت عکس رسپی‌های بدون عکس ─────────
      # عکس‌ها از Pollinations (رایگان، بدون لیمیت) تولید می‌شوند؛
      # Gemini فقط برای vision check روی نسخه ۵۱۲px استفاده می‌شود (مصرف کم).
      # سقف پیشنهادی ۱۰ به‌جای ۱۵، چون هر عکس ۱ تولید + حداکثر ۳ vision check می‌خورد.
      - id: s3
        name: "۳) ساخت عکس رسپی‌های بدون عکس"
        if: ${{ github.event.inputs.focus != 'enrich' }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          LIMIT: ${{ github.event.inputs.images_limit || '10' }}
        run: node scripts/gen-images.mjs

      # ───────── مرحله ۴: افزودن غذاهای جدید (خفیف) ─────────
      # هر غذا ۱ تولید عکس + ۱ تولید JSON + ۱ vision check ≈ ۳ درخواست AI.
      # سقف ۲ در هر اجرا → حداکثر ۶ غذا در هفته → رشد آرام و باکیفیت.
      - id: s4
        name: "۴) افزودن غذاهای جدید"
        if: ${{ github.event.inputs.focus == 'all' || github.event.inputs.focus == '' }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIMIT: ${{ github.event.inputs.import_limit || '2' }}
        run: node scripts/import-recipes.mjs

      # ───────── مرحله ۵: فشرده‌سازی عکس‌های سنگین (بدون API) ─────────
      - id: s5
        name: "۵) فشرده‌سازی عکس‌های سنگین"
        run: node scripts/optimize-images.mjs

      # ───────── مرحله ۵b: استانداردسازی تگ‌ها و وعدهٔ غذایی ─────────
      # برای هر رسپی که meal_tags خالی دارد، تگ‌های وعده + هدف رو از روی
      # category/meal_type/kcal/time_min/macros استنتاج می‌کند. بدون API، فقط منطق.
      # این کار را در هر اجرا تکرار می‌کند تا رسپی‌های جدید هم فوراً تگ بگیرن.
      - id: s5b
        name: "۵b) استانداردسازی تگ‌های وعده و هدف"
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/migrate-meal-tags.mjs

      - name: Commit results
        if: always()
        run: |
          git config user.name "dfb-bot"
          git config user.email "bot@dailyfitbeat.ir"
          git add img import 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "چیزی برای کامیت نبود"
            exit 0
          fi
          git commit -m "auto-pilot: enrich + images + new recipes [skip ci]"
          # مقاوم در برابر rebase conflict:
          # ۱) fetch بدون لمس working tree
          # ۲) rebase تلاش میشه؛ اگه conflict داد، stash + pull + drop + re-apply
          # ۳) اگه باز هم نشد، push با --force-with-lease برای overwrite امن
          git fetch origin main
          if git rebase origin/main; then
            echo "✅ rebase تمیز"
          else
            echo "⚠ rebase conflict — راه‌حل: stash + reset + commit دوباره"
            git rebase --abort 2>/dev/null || true
            git stash --include-untracked 2>/dev/null || true
            git reset --hard origin/main
            git stash pop 2>/dev/null || true
            git add img import 2>/dev/null || true
            git diff --staged --quiet || git commit -m "auto-pilot: enrich + images + new recipes [skip ci]"
          fi
          # push با retry ساده (۳ بار با فاصلهٔ ۱۰ ثانیه)
          for i in 1 2 3; do
            if git push; then
              echo "✅ push موفق"
              exit 0
            fi
            echo "⚠ push شکست (تلاش $i/۳) — صبر ۱۰ث و fetch مجدد"
            sleep 10
            git fetch origin main
            git rebase origin/main 2>/dev/null || git rebase --abort 2>/dev/null || true
          done
          echo "❌ push بعد از ۳ تلاش ناموفق بود — تغییرات local باقی می‌مانند"
          exit 1

      # ───────── مرحله ۶: گزارش به ربات تلگرام ادمین ─────────
      - name: "۶) گزارش به ربات تلگرام ادمین"
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Secrets تلگرام (TG_TOKEN / TG_CHAT) تنظیم نشده — گزارش ارسال نشد"
            exit 0
          fi
          mark() { if [ "$2" = "success" ]; then echo "1"; else echo "0"; fi; }
          T0=$(mark s0 "${{ steps.s0.outcome }}"); T1=$(mark s1 "${{ steps.s1.outcome }}")
          T2=$(mark s2 "${{ steps.s2.outcome }}"); T3=$(mark s3 "${{ steps.s3.outcome }}")
          T4=$(mark s4 "${{ steps.s4.outcome }}"); T5=$(mark s5 "${{ steps.s5.outcome }}")
          T5B=$(mark s5b "${{ steps.s5b.outcome }}")
          TEXT="🤖 گزارش auto-pilot دیلی‌بیت
          وضعیت کل ران: ${{ job.status }}
          ۰) سلامت کلیدها: ${{ steps.s0.outcome }}
          ۱) کشف غذا: ${{ steps.s1.outcome }}
          ۲) غنی‌سازی رسپی قدیمی: ${{ steps.s2.outcome }}
          ۳) ساخت عکس: ${{ steps.s3.outcome }}
          ۴) ایمپورت غذا جدید: ${{ steps.s4.outcome }}
          ۵) بهینه‌سازی عکس: ${{ steps.s5.outcome }}
          ۵b) استانداردسازی تگ‌ها: ${{ steps.s5b.outcome }}
          🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s --max-time 20 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" --data-urlencode text="$TEXT" > /dev/null || true
