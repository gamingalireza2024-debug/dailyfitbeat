<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دستیار تغذیه | DailyFitBeat</title>
<meta name="description" content="دستیار هوشمند تغذیه DailyFitBeat — پیشنهاد رسپی واقعی، کالری و ماکرو">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
html,body{overflow-x:hidden}
.ai-wrap{max-width:820px;margin:0 auto;padding:16px;display:flex;flex-direction:column;min-height:calc(100dvh - 180px)}
.ai-hero{text-align:center;padding:18px 0 8px}
.ai-hero h1{font-size:22px;font-weight:900}
.ai-hero p{color:#667066;font-size:13px;margin-top:6px}
.ai-top{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0}
.chip-usage{background:#e8f4e9;color:#2d6a35;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800}
.ai-tog{font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center;background:#fff;border-radius:999px;padding:7px 14px;box-shadow:0 3px 10px rgba(0,0,0,.06);cursor:pointer}
.ai-tog input{accent-color:#2d6a35;width:15px;height:15px;cursor:pointer}
.btn-ghost-sm{border:0;background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.06)}
#chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:14px;background:rgba(255,255,255,.65);backdrop-filter:blur(8px);border-radius:22px;box-shadow:0 8px 26px rgba(30,43,28,.08);min-height:300px}
.bub{max-width:82%;padding:12px 16px;border-radius:18px;font-size:13.5px;line-height:2;white-space:pre-wrap;word-break:break-word}
.bub.user{align-self:flex-end;background:#2d6a35;color:#fff;border-bottom-left-radius:6px}
.bub.bot{align-self:flex-start;background:#fff;color:#1e2b1c;border-bottom-right-radius:6px;box-shadow:0 3px 10px rgba(0,0,0,.06)}
.bub.sys{align-self:center;background:#fff8e6;color:#7a5b00;font-size:12px;text-align:center;border-radius:14px;max-width:95%}
.bub.typing{display:flex;gap:5px;align-items:center}
.bub.typing i{width:7px;height:7px;border-radius:50%;background:#2d6a35;animation:tp 1s infinite}
.bub.typing i:nth-child(2){animation-delay:.2s}.bub.typing i:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,100%{opacity:.25}50%{opacity:1}}
#quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
#quick button{border:0;background:#fff;border-radius:999px;padding:9px 14px;font:inherit;font-size:12px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.07);transition:transform .15s}
#quick button:hover{transform:translateY(-2px)}
.ai-input{display:flex;gap:8px;margin-top:4px}
#msg{flex:1;resize:none;border:1px solid #d8e2d8;border-radius:16px;padding:12px 14px;font:inherit;font-size:13.5px;max-height:120px;background:#fff;min-width:0}
#msg:focus{outline:2px solid #2d6a35;border-color:#2d6a35}
#send{border:0;background:#2d6a35;color:#fff;border-radius:16px;padding:0 22px;font:inherit;font-weight:800;cursor:pointer}
#send:disabled{opacity:.5;cursor:default}
.aimodal{position:fixed;inset:0;background:rgba(20,30,20,.45);display:none;align-items:center;justify-content:center;z-index:80;padding:14px}
.aimodal.open{display:flex}
.aimodal-box{background:#fff;border-radius:22px;padding:22px;max-width:560px;width:100%;max-height:86dvh;overflow:auto}
.aimodal-box h3{margin-bottom:12px}
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf-grid label{font-size:11px;font-weight:700;color:#557;display:block;margin-bottom:3px}
.pf-grid input,.pf-grid select{width:100%;padding:9px;border-radius:10px;border:1px solid #ccc;font:inherit;font-size:13px}
.pf-full{grid-column:1/-1}
.pf-msg{display:none;border-radius:12px;padding:10px 14px;font-size:12px;margin-top:10px}
.pf-msg.ok{display:block;background:#e8f4e9;color:#2d6a35}
.pf-msg.err{display:block;background:#fdeaea;color:#c22}
@media(max-width:600px){.pf-grid{grid-template-columns:1fr}.bub{max-width:92%}.ai-wrap{padding:10px}}
</style>
</head>
<body data-page="ai">
<header id="hdr"></header>

<section><div class="container ai-wrap">
  <div class="ai-hero">
    <h1>دستیار تغذیه DailyFitBeat</h1>
    <p>بگو چی داری، چی می‌خوای یا امروز چه هدفی داری.</p>
  </div>
  <div class="ai-top">
    <span class="chip-usage" id="usageChip">در حال دریافت سهمیه…</span>
    <label class="ai-tog"><input type="checkbox" id="useProf"> استفاده از پروفایل تغذیه من</label>
    <button class="btn-ghost-sm" id="profBtn">پروفایل تغذیه</button>
  </div>
  <div id="chat" aria-live="polite"></div>
  <div id="quick">
    <button>امروز چی بخورم؟</button>
    <button>با مواد یخچالم چی بپزم؟ مرغ و قارچ و نان دارم</button>
    <button>یه شام کم‌کالری می‌خوام</button>
    <button>پروتئین بیشتری می‌خوام</button>
  </div>
  <div class="ai-input">
    <textarea id="msg" rows="1" placeholder="پیامت رو بنویس… (Enter برای ارسال، Shift+Enter خط جدید)" aria-label="پیام به دستیار تغذیه"></textarea>
    <button id="send" aria-label="ارسال پیام">ارسال</button>
  </div>
</div></section>

<div id="profModal" class="aimodal"><div class="aimodal-box">
  <h3>پروفایل تغذیه من</h3>
  <div class="pf-grid">
    <div><label>هدف</label><select id="pfGoal"><option value="">—</option><option value="کاهش وزن">کاهش وزن</option><option value="افزایش وزن">افزایش وزن</option><option value="حفظ وزن">حفظ وزن</option><option value="تغذیه سالم">تغذیه سالم</option></select></div>
    <div><label>سطح فعالیت</label><select id="pfAct"><option value="">—</option><option value="sedentary">کم‌تحرک</option><option value="light">سبک</option><option value="moderate">متوسط</option><option value="active">فعال</option></select></div>
    <div><label>قد (سانتی‌متر)</label><input id="pfH" type="text" inputmode="numeric"></div>
    <div><label>وزن (کیلوگرم)</label><input id="pfW" type="text" inputmode="numeric"></div>
    <div><label>کالری هدف</label><input id="pfKcal" type="text" inputmode="numeric"></div>
    <div><label>پروتئین (g)</label><input id="pfPro" type="text" inputmode="numeric"></div>
    <div><label>کربوهیدرات (g)</label><input id="pfCarb" type="text" inputmode="numeric"></div>
    <div><label>چربی (g)</label><input id="pfFat" type="text" inputmode="numeric"></div>
    <div class="pf-full"><label>غذاهای مورد علاقه (با ویرگول)</label><input id="pfLike"></div>
    <div class="pf-full"><label>غذاهای نامطلوب (با ویرگول)</label><input id="pfDislike"></div>
    <div class="pf-full"><label>حساسیت‌ها (با ویرگول)</label><input id="pfAllergy"></div>
    <div class="pf-full"><label>محدودیت غذایی (با ویرگول؛ مثلاً گیاهخواری، بدون گلوتن)</label><input id="pfRestr"></div>
  </div>
  <div id="pfMsg" class="pf-msg"></div>
  <div style="display:flex;gap:8px;margin-top:16px">
    <button class="btn" id="pfSave" style="flex:1">ذخیره پروفایل</button>
    <button class="btn ghost" id="pfClose" style="flex:1">بستن</button>
  </div>
</div></div>

<footer id="ftr"></footer>
<script src="site.js"></script>
<script src="app.js"></script>
<script src="ai.js"></script>
</body>
</html>
