<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دستیار تغذیه | DailyFitBeat</title>
<meta name="description" content="دستیار هوشمند تغذیه DailyFitBeat — پیشنهاد رسپی واقعی، کالری و ماکرو">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="design.css">
<style>
.ai-wrap{max-width:860px;margin:0 auto;padding:16px 16px 46px;display:flex;flex-direction:column;min-height:calc(100dvh - 180px)}
.ai-hero{text-align:center;padding:20px 0 6px}
.ai-orb{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffd7ae,var(--accent));box-shadow:0 0 26px rgba(249,115,22,.45);margin:0 auto 14px}
.ai-hero h1{font-size:24px;font-weight:900;margin:0 0 8px}
.ai-hero p{color:var(--ink-soft);font-size:13px;margin:0}
.ai-top{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:16px 0}
.chip-usage{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:8px 16px;font-size:12px;font-weight:800}
.ai-tog{font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;box-shadow:var(--shadow);cursor:pointer;color:var(--ink)}
.ai-tog input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
.btn-ghost-sm{border:0;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--glass-br);border-radius:999px;padding:8px 16px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
#chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);min-height:320px}
.bub{max-width:82%;padding:12px 16px;border-radius:18px;font-size:13.5px;line-height:2;white-space:pre-wrap;word-break:break-word}
.bub.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-left-radius:6px}
.bub.bot{align-self:flex-start;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-bottom-right-radius:6px}
.bub.sys{align-self:center;background:#fff8e6;color:#7a5b00;font-size:12px;text-align:center;border-radius:14px;max-width:95%}
.bub.typing{display:flex;gap:5px;align-items:center}
.bub.typing i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:tp 1s infinite}
.bub.typing i:nth-child(2){animation-delay:.2s}
.bub.typing i:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,100%{opacity:.25}50%{opacity:1}}
#quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}
#quick button{border:0;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--glass-br);border-radius:999px;padding:9px 16px;font:inherit;font-size:12px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink);transition:transform .15s}
#quick button:hover{transform:translateY(-2px)}
.ai-input{display:flex;gap:8px;margin-top:4px}
#msg{flex:1;resize:none;border:1px solid var(--line);border-radius:16px;padding:12px 16px;font:inherit;font-size:13.5px;max-height:120px;background:#fff;min-width:0}
#msg:focus{outline:2px solid var(--accent);border-color:var(--accent)}
#send{border:0;background:var(--accent);color:#fff;border-radius:16px;padding:0 26px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 10px 24px rgba(249,115,22,.25)}
#send:disabled{opacity:.5;cursor:default}
.aimodal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;z-index:90;padding:14px}
.aimodal.open{display:flex}
.aimodal-box{background:var(--surface);border-radius:22px;padding:24px;max-width:560px;width:100%;max-height:86dvh;overflow:auto;box-shadow:var(--shadow)}
.aimodal-box h3{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:10px}
.aimodal-box h3::before{content:"";width:22px;height:3px;border-radius:99px;background:var(--accent)}
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf-grid label{font-size:11px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:4px}
.pf-grid input,.pf-grid select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);font:inherit;font-size:12.5px;background:var(--bg)}
.pf-grid input:focus,.pf-grid select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pf-full{grid-column:1/-1}
.pf-msg{display:none;border-radius:12px;padding:10px 14px;font-size:12px;margin-top:12px}
.pf-msg.ok{display:block;background:#e8f4e9;color:#2d6a35}
.pf-msg.err{display:block;background:#fdeaea;color:#c22}
@media(max-width:600px){.pf-grid{grid-template-columns:1fr}.bub{max-width:92%}.ai-wrap{padding:10px 12px 36px}}
</style>
</head>
<body data-page="ai">
<header id="hdr"></header>

<section><div class="ai-wrap">
  <div class="ai-hero">
    <div class="ai-orb" aria-hidden="true"></div>
    <h1>دستیار تغذیه DailyFitBeat</h1>
    <p>بگو چی داری، چی می‌خوای یا امروز چه هدفی داری.</p>
  </div>

  <div class="ai-top">
    <span class="chip-usage" id="usageChip">در حال دریافت سهمیه…</span>
    <label class="ai-tog"><input type="checkbox" id="useProf"> استفاده از پروفایل تغذیه من</label>
    <button class="btn-ghost-sm" id="profBtn">پروفایل تغذیه</button>
  </div>
<div class="dfb-mascot" id="mascot" aria-hidden="true">
  <img id="mascotImg" src="img/mascot-idle.png" alt="">
  <span class="m-shadow"></span>
</div>
<style>
.dfb-mascot{width:140px;margin:6px auto 12px;position:relative;text-align:center}
.dfb-mascot img{width:100%;display:block;animation:mFloat 3s ease-in-out infinite;transform-origin:bottom center}
.dfb-mascot .m-shadow{display:block;width:70%;height:10px;margin:6px auto 0;background:rgba(17,24,39,.12);border-radius:50%;filter:blur(4px);animation:mShadow 3s ease-in-out infinite}
.dfb-mascot.think img{animation:mThink 1.2s ease-in-out infinite}
.dfb-mascot.happy img{animation:mHappy .9s ease-in-out 2}
.dfb-mascot.sad img{animation:mSad .8s ease-in-out 2}
@keyframes mFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes mShadow{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.8);opacity:.3}}
@keyframes mThink{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg)}70%{transform:rotate(5deg)}}
@keyframes mHappy{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-14px) scale(1.05)}}
@keyframes mSad{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
  <div id="chat" aria-live="polite"></div>

  <div id="quick">
    <button>امروز چی بخورم؟</button>
    <button>با مواد یخچالم چی بپزم؟ مرغ و قارچ و نان دارم</button>
    <button>یه شام کم‌کالری می‌خوام</button>
    <button>پروتئین بیشتری می‌خوام</button>
  </div>

  <div class="ai-input">
    <textarea id="msg" rows="1" placeholder="پیامت رو بنویس… (Enter برای ارسال، Shift+Enter خط جدید)" aria-label="پیام به دستیار تغذیه"></textarea>
    <button id="send" aria-label="ارسال پیام">ارسال</button>
  </div>
</div></section>

<div id="profModal" class="aimodal"><div class="aimodal-box">
  <h3>پروفایل تغذیه من</h3>
  <div class="pf-grid">
    <div><label>هدف</label><select id="pfGoal"><option value="">—</option><option value="کاهش وزن">کاهش وزن</option><option value="افزایش وزن">افزایش وزن</option><option value="حفظ وزن">حفظ وزن</option><option value="تغذیه سالم">تغذیه سالم</option></select></div>
    <div><label>سطح فعالیت</label><select id="pfAct"><option value="">—</option><option value="sedentary">کم‌تحرک</option><option value="light">سبک</option><option value="moderate">متوسط</option><option value="active">فعال</option></select></div>
    <div><label>قد (سانتی‌متر)</label><input id="pfH" type="text" inputmode="numeric"></div>
    <div><label>وزن (کیلوگرم)</label><input id="pfW" type="text" inputmode="numeric"></div>
    <div><label>کالری هدف</label><input id="pfKcal" type="text" inputmode="numeric"></div>
    <div><label>پروتئین (g)</label><input id="pfPro" type="text" inputmode="numeric"></div>
    <div><label>کربوهیدرات (g)</label><input id="pfCarb" type="text" inputmode="numeric"></div>
    <div><label>چربی (g)</label><input id="pfFat" type="text" inputmode="numeric"></div>
    <div class="pf-full"><label>غذاهای مورد علاقه (با ویرگول)</label><input id="pfLike"></div>
    <div class="pf-full"><label>غذاهای نامطلوب (با ویرگول)</label><input id="pfDislike"></div>
    <div class="pf-full"><label>حساسیت‌ها (با ویرگول)</label><input id="pfAllergy"></div>
    <div class="pf-full"><label>محدودیت غذایی (با ویرگول؛ مثلاً گیاهخواری، بدون گلوتن)</label><input id="pfRestr"></div>
  </div>
  <div id="pfMsg" class="pf-msg"></div>
  <div style="display:flex;gap:8px;margin-top:16px">
    <button class="btn" id="pfSave" style="flex:1">ذخیره پروفایل</button>
    <button class="btn ghost" id="pfClose" style="flex:1">بستن</button>
  </div>
</div></div>

<footer id="ftr"></footer>
<script src="site.js"></script>
<script src="app.js"></script>
<script src="ai.js"></script>
</body>
</html>
