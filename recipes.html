<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رسپی‌ها | DailyFitBeat</title>
<meta name="description" content="رسپی‌های سالم ایرانی و جهانی با ارزش غذایی دقیق، فیلتر بر اساس هدف و دسته">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.no-res{color:#777}
</style>
</head>
<body data-page="recipes">
<header id="hdr"></header>

<div class="page-head"><div class="container"><h1>رسپی‌ها</h1><p>هر چی هوس کردی، سالم‌ترش اینجاست</p></div></div>

<section><div class="container">
  <div class="filters">
    <button class="chip on" data-cat="all">همه</button>
    <button class="chip" data-cat="iranian">ایرانی</button>
    <button class="chip" data-cat="salad">سالاد</button>
    <button class="chip" data-cat="sandwich">ساندویچ</button>
    <button class="chip" data-cat="breakfast">صبحانه</button>
    <button class="chip" data-cat="soup">سوپ</button>
    <button class="chip on" data-goal="all">هر هدفی</button>
    <button class="chip" data-goal="high-protein">پروتئین بالا</button>
    <button class="chip" data-goal="weight-loss">کاهش وزن</button>
    <button class="chip" data-goal="quick">سریع</button>
    <button class="chip" data-goal="vegetarian">گیاهی</button>
  </div>
  <div id="recipeGrid" class="cards"></div>
</div></section>

<footer id="ftr"></footer>
<script src="site.js"></script>
<script src="app.js"></script>
</body>
</html>
